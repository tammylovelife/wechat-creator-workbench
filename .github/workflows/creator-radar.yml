name: Personal Creator Radar

on:
  schedule:
    # 20:00 China Standard Time (UTC+8)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-daily-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workbench
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Search, filter, and push tonight's five ideas
        run: node scripts/creator-radar.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Remember what was sent
        run: |
          if git diff --quiet -- data/creator-radar-history.json; then
            exit 0
          fi
          git config user.name "creator-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/creator-radar-history.json
          git commit -m "chore: remember daily creator radar"
          git push
